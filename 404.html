
<!DOCTYPE html>

  <meta name="robots" content="noindex">
  <title>404 | Baptiste Bergeon</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #030e20;
      color: #f8fafc;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 24px;
    }

    h1 {
      font-size: clamp(5rem, 15vw, 9rem);
      margin: 0;
      color: #5ff5d1;
    }

    p { color: #a8b7c9; line-height: 1.6; }

    a {
      display: inline-block;
      margin-top: 20px;
      padding: 15px 24px;
      background: #5ff5d1;
      color: #031222;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
    }

    a:hover { background: #42dcb9; }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
